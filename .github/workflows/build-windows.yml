name: Build Windows executables

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "lab/**"
      - "requirements.txt"
      - "build_windows.bat"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build inventory lab
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RobRunInventoryLab app.py

      - name: Build overlay lab
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RobRunOverlayLab overlay_lab.py

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: ROB-RUN-Labs-Windows
          path: |
            dist/RobRunInventoryLab.exe
            dist/RobRunOverlayLab.exe
          if-no-files-found: error
